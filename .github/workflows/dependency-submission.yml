name: Dependency Submission

# NOTE (xerootg fork): upstream runs this on every push. That would fire a full
# Ghidra build for each branch and tag the fork-release workflow pushes, so it is
# manual-only here. Release builds are produced by .github/workflows/fork-release.yml.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read Ghidra JDK Version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV 

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Fetch Dependencies
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          gradle-version: '9.5.1'
